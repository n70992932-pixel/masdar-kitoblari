<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boshqaruv Paneli | Masdar Kitoblari</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Admin Global Variables */
    :root {
      --admin-bg: #1e1e1e;
      --admin-surface: #2c2c2c;
      --admin-border: #3d3d3d;
      --admin-text: #e0e0e0;
      --admin-primary: #4a90e2;
      --admin-danger: #e24a4a;
      --admin-success: #4ae26f;
    }

    body {
      background-color: var(--admin-bg);
      color: var(--admin-text);
      font-family: 'Inter', sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Login Screen */
    .admin-login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      height: 100vh;
    }
    .admin-login-card {
      background: var(--admin-surface);
      padding: 3rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--admin-border);
      text-align: center;
    }
    .admin-login-card h2 {
      margin-bottom: 2rem;
      color: white;
    }
    .admin-form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .admin-form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: #aaa;
    }
    .admin-form-group input {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid var(--admin-border);
      border-radius: 6px;
      background: var(--admin-bg);
      color: white;
      outline: none;
      transition: border-color 0.3s;
      box-sizing: border-box;
    }
    .admin-form-group input:focus {
      border-color: var(--admin-primary);
    }
    .btn-admin {
      width: 100%;
      padding: 0.8rem;
      background: var(--admin-primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }
    .btn-admin:hover {
      background: #357abd;
    }

    /* Dashboard Screen */
    .dashboard-layout {
      display: none;
      flex: 1;
    }
    
    .sidebar {
      width: 250px;
      background: var(--admin-surface);
      border-right: 1px solid var(--admin-border);
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
    }
    .sidebar-logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: white;
      text-align: center;
      margin-bottom: 3rem;
      text-decoration: none;
    }
    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .sidebar-menu li {
      margin-bottom: 0.5rem;
    }
    .sidebar-menu a {
      display: block;
      padding: 0.8rem 1rem;
      color: var(--admin-text);
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .sidebar-menu a:hover, .sidebar-menu a.active {
      background: var(--admin-primary);
      color: white;
    }

    .main-content {
      flex: 1;
      padding: 2rem 3rem;
      overflow-y: auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3rem;
      border-bottom: 1px solid var(--admin-border);
      padding-bottom: 1rem;
    }
    .topbar h1 {
      margin: 0;
      font-size: 1.8rem;
    }
    .btn-logout {
      background: transparent;
      color: var(--admin-danger);
      border: 1px solid var(--admin-danger);
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-logout:hover {
      background: var(--admin-danger);
      color: white;
    }

    /* Cards & Tables */
    .card {
      background: var(--admin-surface);
      border-radius: 12px;
      border: 1px solid var(--admin-border);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .card-header h3 {
      margin: 0;
    }
    .table {
      width: 100%;
      border-collapse: collapse;
    }
    .table th, .table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--admin-border);
    }
    .table th {
      color: #aaa;
      font-weight: 500;
      text-transform: uppercase;
      font-size: 0.8rem;
    }
    .btn-sm {
      padding: 0.3rem 0.6rem;
      font-size: 0.8rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      color: white;
    }
    .btn-danger { background: var(--admin-danger); }
    .btn-success { background: var(--admin-success); color: #000; font-weight: bold;}
    
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="admin-login-wrapper" id="login-view">
    <div class="admin-login-card">
      <h2>Boshqaruv Paneli</h2>
      <form id="admin-login-form">
        <div class="admin-form-group">
          <label>Email manzil</label>
          <input type="email" id="login-email" placeholder="admin@masdar.uz" required>
        </div>
        <div class="admin-form-group">
          <label>Parol</label>
          <input type="password" id="login-password" placeholder="Parolni kiriting" required>
        </div>
        <button type="submit" class="btn-admin">Tizimga kirish</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div class="dashboard-layout" id="dashboard-view">
    <aside class="sidebar">
      <a href="index.html" class="sidebar-logo">MASDAR</a>
      <ul class="sidebar-menu">
        <li><a href="#" class="active">Kitoblar</a></li>
        <li><a href="index.html" target="_blank">Saytni ko'rish ↗</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <h1>Kitoblar ro'yxati</h1>
        <div>
          <button id="logout-btn" class="btn-logout">Chiqish</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Yangi kitob qo'shish</h3>
        </div>
        <form id="add-book-form">
          <div class="grid-2">
            <div class="admin-form-group">
              <label>Kitob nomi (O'zbekcha)</label>
              <input type="text" id="title_uz" placeholder="Masalan: O'tkan kunlar" required>
            </div>
            <div class="admin-form-group">
              <label>Muallif</label>
              <input type="text" id="author" placeholder="Abdulla Qodiriy" required>
            </div>
            <div class="admin-form-group">
              <label>Narx (so'm)</label>
              <input type="number" id="price" placeholder="45000" required>
            </div>
            <div class="form-group">
                  <label for="book-cover">Muqova rasmi (Fayl)</label>
                  <input type="file" id="book-cover" accept="image/*" required>
                </div>
          </div>
          <button type="submit" class="btn-admin" style="width: auto; padding: 0.8rem 2rem;">Qo'shish</button>
        </form>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Barcha kitoblar</h3>
          <button id="import-btn" class="btn-sm btn-success">Eski kitoblarni bazaga tortish</button>
        </div>
        <table class="table">
          <thead>
            <tr>
              <th>Rasm</th>
              <th>Nom</th>
              <th>Muallif</th>
              <th>Narx</th>
              <th>Harakatlar</th>
            </tr>
          </thead>
          <tbody id="admin-books-list">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>

    </main>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/books.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
